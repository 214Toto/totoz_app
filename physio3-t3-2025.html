    <script>
    /* =====================================================================
       SECTION A — 100 MCQs (exact text from the 2025 paper)
       ===================================================================== */
    const sectionA = [
    {
        q: `A 45-year-old male presents with loss of fine motor control in his right hand. An MRI reveals a lesion affecting the left internal capsule. Which tract is most likely responsible for his symptoms?`,
        options: [
            `Rubrospinal tract`,
            `Anterior corticospinal tract`,
            `Lateral corticospinal tract`,
            `Tectospinal tract`,
            `Vestibulospinal tract`
        ],
        correct: `C`,
        explanation: `The corticospinal tract descends from the motor cortex through the posterior limb of the internal capsule, the cerebral peduncles, the pons, and the medullary pyramids, where 85–90% of fibres decussate to form the lateral corticospinal tract. A lesion in the left internal capsule therefore interrupts the corticospinal fibres destined for the right side of the body, producing contralateral fine motor deficits — in this case, loss of fine motor control in the right hand. The lateral corticospinal tract controls distal limb muscles (especially the hands and fingers), which explains the predominant hand involvement. The rubrospinal tract originates from the red nucleus and controls flexor tone; the anterior corticospinal tract controls axial/proximal muscles; the tectospinal tract controls head/neck reflexes to visual stimuli; and the vestibulospinal tract controls balance and postural tone.`
    },
    {
        q: `A patient with a lesion affecting the anterior white column of the spinal cord is most likely to show which deficit?`,
        options: [
            `Loss of voluntary facial movements`,
            `Poor limb coordination`,
            `Spastic paralysis of the lower limbs`,
            `Ipsilateral facial anesthesia`,
            `Impaired postural adjustments`
        ],
        correct: `E`,
        explanation: `The anterior white column of the spinal cord contains the anterior corticospinal tract, which is the uncrossed component of the corticospinal tract (about 10–15% of fibres). The anterior corticospinal tract descends ipsilaterally in the anterior funiculus and crosses at the level of termination to innervate axial and proximal muscles of the trunk and neck, as well as the proximal limbs. Its primary role is in postural adjustments and gross movements of the axial musculature. A lesion of the anterior white column therefore produces impaired postural adjustments rather than paralysis of the distal limbs. Loss of voluntary facial movements would involve the corticobulbar tract; poor limb coordination would involve the cerebellum or spinocerebellar tracts; spastic paralysis of the lower limbs would involve the lateral corticospinal tract; and ipsilateral facial anesthesia would involve the trigeminal pathway.`
    },
    {
        q: `A 30-year-old woman develops a lesion to the right red nucleus. What motor finding is most expected?`,
        options: [
            `Increased tone in left arm flexors`,
            `Flaccid paralysis of the left arm`,
            `Weakness in right leg extensors`,
            `Bilateral loss of proprioception`,
            `Atrophy of neck flexors`
        ],
        correct: `A`,
        explanation: `The red nucleus gives rise to the rubrospinal tract, which decussates immediately in the ventral tegmental decussation and descends in the lateral funiculus of the spinal cord. The rubrospinal tract excites flexor motor neurons and inhibits extensor motor neurons, primarily in the upper limbs (its influence is greater on the arms than the legs). A lesion of the right red nucleus would therefore reduce rubrospinal input to the LEFT side of the spinal cord, leading to a relative excess of extensor tone and increased tone in the flexors of the left arm — the classic finding of a rubrospinal lesion. Flaccid paralysis would be a lower motor neuron finding; weakness in the right leg extensors would be ipsilateral and involves the leg, not the arm; bilateral loss of proprioception involves the dorsal columns; and atrophy of neck flexors is not a recognized rubrospinal syndrome.`
    },
    {
        q: `Damage to the lateral corticospinal tract at the cervical level would cause which clinical feature?`,
        options: [
            `Contralateral hemiparesis of the arm`,
            `Ipsilateral spastic paralysis of the upper limb`,
            `Ipsilateral flaccid paralysis of the leg`,
            `Contralateral sensory loss of fine touch`,
            `Bilateral Babinski signs`
        ],
        correct: `B`,
        explanation: `The lateral corticospinal tract is formed by the crossed fibres of the corticospinal tract after decussation in the medullary pyramids. Once it has crossed, it descends in the lateral funiculus of the spinal cord IPSILATERAL to the side of the body it innervates. Therefore, a lesion of the lateral corticospinal tract at the cervical level produces IPSILATERAL spastic paralysis of the upper limb (and eventually the lower limb, depending on the level). The classic signs of an upper motor neuron lesion are spasticity, hyperreflexia, clonus, and a positive Babinski sign. Contralateral hemiparesis would occur with a lesion ABOVE the decussation (e.g., internal capsule or cerebral peduncle); ipsilateral flaccid paralysis would be a lower motor neuron finding; contralateral sensory loss would involve the spinothalamic or dorsal column pathways; and bilateral Babinski signs would suggest a spinal cord lesion affecting both sides or a more diffuse process.`
    },
    {
        q: `A 56-year-old man is unable to maintain balance when standing still. He sways and falls with his eyes closed (positive Romberg). There is no limb weakness. A lesion to which descending tract could explain the imbalance?`,
        options: [
            `Corticospinal tract`,
            `Rubrospinal tract`,
            `Reticulospinal tract`,
            `Vestibulospinal tract`,
            `Tectospinal tract`
        ],
        correct: `D`,
        explanation: `A positive Romberg sign — worsening of balance with the eyes closed in the absence of limb weakness — indicates a defect in proprioceptive or vestibular input to the balance system. The vestibulospinal tract, which originates from the vestibular nuclei (especially Deiters' nucleus/lateral vestibular nucleus) and descends in the anterior funiculus, is critical for maintaining balance and postural tone by facilitating extensor motor neurons and adjusting posture in response to vestibular input. A lesion of the vestibulospinal tract would impair the ability to maintain balance, particularly when visual cues are removed (eyes closed). The corticospinal tract controls voluntary movement; the rubrospinal tract controls flexor tone; the reticulospinal tract modulates posture and tone but is less specifically involved in balance; and the tectospinal tract controls head/neck reflexes to visual stimuli.`
    },
    {
        q: `Following a spinal cord injury at T10, a patient shows spasticity of lower limb muscles. Which tract damage most likely accounts for this?`,
        options: [
            `Anterior corticospinal tract`,
            `Reticulospinal tract`,
            `Rubrospinal tract`,
            `Lateral corticospinal tract`,
            `Tectospinal tract`
        ],
        correct: `D`,
        explanation: `Spasticity after spinal cord injury is a classic upper motor neuron sign and results from interruption of the lateral corticospinal tract, which provides the major descending inhibitory control over spinal reflex arcs. When the lateral corticospinal tract is damaged, the spinal motor neurons below the lesion lose their normal descending inhibition and become hyperexcitable, leading to spasticity, hyperreflexia, clonus, and a positive Babinski sign. At T10, the lateral corticospinal tract has already crossed in the medulla, so the lesion affects the ipsilateral lower limb. The anterior corticospinal tract primarily controls axial muscles; the reticulospinal tract modulates tone but is not the primary tract whose loss causes spasticity; the rubrospinal tract primarily influences upper limb flexor tone; and the tectospinal tract controls head/neck reflexes.`
    },
    {
        q: `Which descending tract originates from the superior colliculus and is involved in reflex postural head movements in response to visual stimuli?`,
        options: [
            `Rubrospinal tract`,
            `Tectospinal tract`,
            `Vestibulospinal tract`,
            `Corticospinal tract`,
            `Reticulospinal tract`
        ],
        correct: `B`,
        explanation: `The tectospinal tract originates from the superior colliculus (the "tectum" of the midbrain), which receives visual and auditory input. It decussates in the dorsal tegmental decussation and descends to the cervical spinal cord, where it controls reflex postural movements of the head and neck in response to visual and auditory stimuli — for example, turning the head toward a sudden noise or a moving object. The rubrospinal tract originates from the red nucleus and controls flexor tone; the vestibulospinal tract originates from the vestibular nuclei and controls balance; the corticospinal tract originates from the motor cortex and controls voluntary movement; and the reticulospinal tract originates from the reticular formation and modulates posture and tone.`
    },
    {
        q: `The corticospinal tract is said to deactivate in which specific part of the CNS?`,
        options: [
            `Midbrain`,
            `Pons`,
            `Anterior horn of the spinal cord`,
            `Bulbomedullary junction`,
            `Internal capsule`
        ],
        correct: `D`,
        explanation: `The question asks where the corticospinal tract "deactivates" — this is a typo for "decussates." The corticospinal tract descends from the motor cortex through the internal capsule, midbrain (cerebral peduncles), pons, and medulla. At the junction between the medulla and the spinal cord (the bulbomedullary junction, also called the cervicomedullary junction), about 85–90% of the fibres cross to the opposite side in the decussation of the pyramids. These crossed fibres form the lateral corticospinal tract. The remaining 10–15% continue uncrossed as the anterior corticospinal tract and cross at the spinal level of termination. Therefore, the correct answer is the bulbomedullary junction.`
    },
    {
        q: `Following a unilateral cortical stroke, a patient exhibits lower facial paralysis on the contralateral side, but forehead movement is spared. What is the best explanation?`,
        options: [
            `Bilateral innervation to lower face`,
            `Unilateral control of lower face via corticospinal tract`,
            `Bilateral corticobulbar input to upper face`,
            `Ipsilateral cranial nerve VII damage`,
            `Decussation failure of corticospinal tract`
        ],
        correct: `C`,
        explanation: `The upper face (forehead, eyebrow) receives bilateral corticobulbar innervation from both cerebral hemispheres, whereas the lower face receives predominantly unilateral (contralateral) corticobulbar innervation. A unilateral cortical stroke (e.g., in the internal capsule or motor cortex) therefore interrupts the corticobulbar fibres to the contralateral lower face, causing weakness of the lower face on the opposite side, while the upper face is spared because it continues to receive input from the unaffected hemisphere. This is the classic "forehead sparing" pattern of an upper motor neuron facial palsy. In contrast, a lower motor neuron lesion (e.g., Bell's palsy) affects the entire ipsilateral face, including the forehead.`
    },
    {
        q: `The medial reticulospinal tract primarily exerts what action on spinal motor neurons?`,
        options: [
            `Facilitates extensor tone`,
            `Inhibits flexor tone`,
            `Inhibits all LMNs`,
            `Excites facial motor nuclei`,
            `Facilitates deactivation`
        ],
        correct: `A`,
        explanation: `The medial reticulospinal tract originates from the pontine reticular formation and descends in the anterior funiculus of the spinal cord. It primarily facilitates extensor motor neurons and inhibits flexor motor neurons, thereby helping to maintain posture and support the body against gravity. It also plays a role in the maintenance of muscle tone and in the integration of postural adjustments. The lateral reticulospinal tract, by contrast, originates from the medullary reticular formation and has the opposite effect — it inhibits extensor tone and facilitates flexor tone. The other options are incorrect: the tract does not inhibit all lower motor neurons, does not primarily excite facial motor nuclei (that is the corticobulbar tract), and "facilitates deactivation" is not a physiological description.`
    },
    {
        q: `In a patient with hemisection of the spinal cord (Brown-Sequard syndrome) at the T6 level on the right, which motor deficit would be expected?`,
        options: [
            `Left-sided facial weakness`,
            `Bilateral leg weakness`,
            `Left-sided flaccid paralysis at T6`,
            `Right-sided intention tremor`,
            `Right-sided spastic paralysis below T6`
        ],
        correct: `E`,
        explanation: `Brown-Sequard syndrome results from hemisection of the spinal cord. At the level of the lesion, there is ipsilateral lower motor neuron paralysis (due to damage to the anterior horn cells and emerging nerve roots), and below the lesion, there is ipsilateral spastic paralysis (due to interruption of the corticospinal tract, which has already crossed in the medulla and descends ipsilaterally). Therefore, a right-sided hemisection at T6 produces right-sided spastic paralysis below T6. There is also ipsilateral loss of proprioception and vibration (dorsal column), and contralateral loss of pain and temperature (spinothalamic tract, which crosses at the level of entry and ascends contralaterally). Left-sided facial weakness would be a brainstem lesion; bilateral leg weakness would suggest a complete cord lesion; left-sided flaccid paralysis would be a lower motor neuron lesion; and right-sided intention tremor would be a cerebellar finding.`
    },
    {
        q: `A neuroanatomical dissection reveals damage to fibers descending from layer V of the motor cortex. Which of the following motor signs would you most expect?`,
        options: [
            `Loss of visual tracking`,
            `Paralysis of ipsilateral limbs`,
            `Spastic paralysis of contralateral limbs`,
            `Loss of facial sensation`,
            `Flaccid paralysis of tongue`
        ],
        correct: `C`,
        explanation: `Layer V of the motor cortex contains the large pyramidal cells of Betz, which give rise to the corticospinal tract. These fibres descend through the internal capsule, cerebral peduncles, pons, and medullary pyramids, where most decussate to form the lateral corticospinal tract. Therefore, damage to these fibres produces spastic paralysis of the CONTRALATERAL limbs. Spasticity, hyperreflexia, and a positive Babinski sign are the hallmarks of an upper motor neuron lesion. Ipsilateral paralysis would occur with a lesion below the decussation (e.g., spinal cord); loss of visual tracking involves the tectospinal or cortical visual pathways; loss of facial sensation involves the trigeminal pathway; and flaccid paralysis of the tongue would be a lower motor neuron lesion of the hypoglossal nerve.`
    },
    {
        q: `A lesion in the posterior limb of the internal capsule would most likely disrupt:`,
        options: [
            `Voluntary motor control of the limbs`,
            `Visual reflexes`,
            `Neck muscle coordination`,
            `Sensory pain pathways`,
            `Sympathetic output to the eye`
        ],
        correct: `A`,
        explanation: `The posterior limb of the internal capsule contains the corticospinal tract (which controls voluntary motor function of the limbs), the corticobulbar fibres (which control voluntary motor function of the face and head), and the sensory fibres of the thalamocortical radiations (which carry somatosensory information to the cortex). Because the corticospinal tract is the most prominent and clinically significant component, a lesion in the posterior limb most typically produces contralateral hemiparesis (voluntary motor deficits). The classic "lacunar" stroke of the internal capsule is a pure motor stroke. Visual reflexes involve the superior colliculus and tectospinal tract; neck muscle coordination involves the tectospinal and vestibulospinal tracts; sensory pain pathways involve the spinothalamic tract; and sympathetic output to the eye involves the hypothalamospinal pathway.`
    },
    {
        q: `The anterior corticospinal tract differs from the lateral corticospinal tract in that:`,
        options: [
            `It crosses at the medulla`,
            `It innervates contralateral limb muscles`,
            `It controls axial musculature and decussates at the spinal level`,
            `It controls facial expression`,
            `It is an extrapyramidal tract`
        ],
        correct: `C`,
        explanation: `The anterior corticospinal tract consists of the ~10–15% of corticospinal fibres that do NOT cross in the medullary pyramids. Instead, they descend ipsilaterally in the anterior funiculus of the spinal cord and cross at the level of their termination in the spinal cord. They primarily innervate axial and proximal muscles of the trunk and neck (as well as proximal limb muscles) and are involved in postural adjustments and gross movements. The lateral corticospinal tract, by contrast, crosses at the medulla, descends in the lateral funiculus, and innervates distal limb muscles (especially the hands and fingers). The anterior corticospinal tract is not an extrapyramidal tract; it is part of the pyramidal (corticospinal) system.`
    },
    {
        q: `A patient has difficulty coordinating movement in the trunk and proximal limbs. Which descending system is most likely involved?`,
        options: [
            `Lateral motor system`,
            `Medial motor system`,
            `Spinothalamic tract`,
            `Spinocerebellar tract`,
            `Corticobulbar tract`
        ],
        correct: `B`,
        explanation: `The medial motor system comprises the descending tracts that control axial and proximal muscles — the anterior corticospinal tract, the vestibulospinal tract, the medial reticulospinal tract, and the tectospinal tract. These tracts are responsible for posture, balance, and gross movements of the trunk and proximal limbs. The lateral motor system comprises the lateral corticospinal tract and the rubrospinal tract, which control distal limb muscles (especially the hands and fingers). Difficulty coordinating trunk and proximal limb movements therefore points to the medial motor system. The spinothalamic tract carries pain and temperature; the spinocerebellar tract carries unconscious proprioception; and the corticobulbar tract controls facial and head muscles.`
    },
    {
        q: `Which of the following best describes the type of synapse involved in the stretch reflex?`,
        options: [
            `Polysynaptic with inhibitory interneurons`,
            `Disynaptic with gamma loop`,
            `Intersegmental polysynaptic`,
            `Multisynaptic and reciprocal`,
            `Monosynaptic between Ia afferent and alpha motor neuron`
        ],
        correct: `E`,
        explanation: `The stretch reflex (myotatic reflex) is the simplest reflex in the nervous system and is MONOSYNAPTIC. The afferent limb is the Group Ia (primary) afferent from the muscle spindle, which synapses directly onto the alpha motor neuron in the anterior horn of the spinal cord. The efferent limb is the alpha motor neuron, which innervates the extrafusal fibres of the same muscle. This monosynaptic connection produces the rapid muscle contraction seen in the knee-jerk (patellar) reflex. Although the stretch reflex is monosynaptic, it is accompanied by reciprocal inhibition of the antagonist muscle, which IS polysynaptic (mediated by an inhibitory interneuron). However, the primary reflex arc itself is monosynaptic.`
    },
    {
        q: `A lesion to which of the following would abolish the afferent limb of the patellar reflex?`,
        options: [
            `Type II fibers`,
            `Muscle spindle`,
            `Gamma motor neuron`,
            `Golgi tendon organ`,
            `Alpha motor neuron`
        ],
        correct: `B`,
        explanation: `The afferent limb of the patellar reflex is the Group Ia (primary) afferent from the muscle spindle. The muscle spindle is the receptor that detects stretch of the quadriceps muscle when the patellar tendon is tapped. A lesion of the muscle spindle would abolish the afferent limb and therefore the reflex. The gamma motor neuron innervates the intrafusal fibres of the spindle and adjusts its sensitivity but is not the afferent limb. The Golgi tendon organ is the receptor for the inverse stretch reflex (clasp-knife reflex) and mediates the Group Ib afferent. The alpha motor neuron is the efferent limb. Type II fibres are spindle afferents that signal static muscle length but are not the primary afferent for the stretch reflex.`
    },
    {
        q: `Gamma motor neurons primarily regulate which aspect of the muscle spindle?`,
        options: [
            `Inhibition of the antagonist`,

        explanation: `The vermis (part of the spinocerebellum) is located in the midline of the cerebellum and is responsible for the control of axial and proximal muscles, posture, and gait. A midline posterior fossa tumor (e.g., medulloblastoma) affecting the vermis produces truncal ataxia — a broad-based, lurching gait with truncal swaying. The lateral hemispheres (cerebrocerebellum) control distal limb movements; the flocculonodular lobe (vestibulocerebellum) controls balance and eye movements; the interposed nuclei are involved in limb coordination; and the fastigial nucleus is an output nucleus of the vermis.`
    },
    {
        q: `A 54-year-old with alcohol use disorder has progressive gait instability and difficulty tandem walking. MRI shows anterior vermian atrophy. What is the cardinal deficit?`,

        correct: `B`,

    },
    {
        q: `A 42-year-old's finger-to-nose shows intention tremor only near the target. Mechanism?`,

        correct: `E`,
        explanation: `Intention tremor (also called kinetic tremor) is a hallmark of cerebellar disease. It occurs during voluntary movement and worsens as the limb approaches the target. The mechanism is CEREBELLAR COMPARATOR FAILURE: the cerebellum normally compares the intended movement (from the motor cortex) with the actual movement (from proprioceptive feedback) and makes corrective adjustments. When the cerebellum is damaged, this comparator function fails, leading to overshoot and corrective oscillations — the intention tremor. The other options do not explain intention tremor: loss of basal ganglia inhibition causes rest tremor or chorea; corticospinal tract damage causes weakness; vestibular hypofunction causes balance problems; and impaired dorsal column input causes sensory ataxia (which worsens with eyes closed).`
    },
    {

    },
    {
        q: `A blow to the occiput causes immediate inability to stand unaided, with a wide-based gait and trunk sway. Which nucleus is most likely affected?`,

            `Red nucleus`,

    {

        explanation: `Pendular reflexes (pendular knee jerks) are a classic sign of cerebellar disease. Normally, the cerebellum facilitates the braking of the stretch reflex, so the leg swings a few times and then stops. In cerebellar disease, the REFLEX BRAKING IS REDUCED, so the leg swings back and forth multiple times like a pendulum (pendular reflex). This is due to reduced cerebellar facilitation of the stretch reflex braking. Hypotonia is also a feature of cerebellar disease. The other options do not explain pendular reflexes: loss of spinal inhibitory interneurons would cause hyperreflexia; increased gamma drive would cause spasticity; basal ganglia damage causes movement disorders; and UMN lesions cause hyperreflexia and spasticity.`

    },
    {
        q: `A patient cannot rapidly alternate pronation/supination. This is called:`,

        correct: `C`,
        explanation: `Dysdiadochokinesia is the inability to perform rapid, alternating movements (such as pronation and supination of the forearm). It is a classic sign of cerebellar disease. Dysmetria is the inability to gauge distance (overshoot or undershoot of a target); asterixis is a flapping tremor; akathisia is a feeling of restlessness; and clonus is rhythmic muscle contraction (an upper motor neuron sign).`
    },
    {
        q: `A 33-year-old has normal strength but cannot smoothly coordinate multi-joint reaches; movements are broken into components. This phenomenon is:`,

    {

    },
    {
        q: `A 28-year-old runner gets a sharp tap to the patellar tendon; the knee extends briskly. Which afferent fiber mediates the central excitatory synapse to quadriceps α-motor neurons?`,
        options: [

        ],
        correct: `C`,
        explanation: `The patellar (knee-jerk) reflex is a monosynaptic stretch reflex. The afferent limb is the GROUP Ia (PRIMARY) AFFERENT from the muscle spindle, which synapses directly onto the alpha motor neurons of the quadriceps muscle in the anterior horn of the spinal cord. The efferent limb is the alpha motor neuron, which causes the quadriceps to contract and the knee to extend. Group II afferents signal static muscle length but are not the primary afferent for the stretch reflex; Group Ib afferents are from Golgi tendon organs; Aβ cutaneous mechanoreceptors mediate touch; and C fibres are nociceptors.`
    },
    {
        q: `A 62-year-old with acute lateral medullary infarct shows ipsilateral facial pain loss and contralateral body pain loss but hyperreflexic limbs weeks later. What explains delayed hyperreflexia?`,

            `Decreased γ-bias`,

        correct: `B`,
        explanation: `The lateral medullary (Wallenberg) infarct damages the spinal trigeminal nucleus and tract (causing ipsilateral facial pain/temperature loss) and the spinothalamic tract (causing contralateral body pain/temperature loss). The delayed hyperreflexia in the limbs is due to LOSS OF DESCENDING INHIBITION on spinal circuits. The corticospinal and other descending inhibitory tracts may be affected by the infarct or by secondary changes, leading to hyperreflexia weeks later. Loss of Ia afferents would cause areflexia; failure of Renshaw recurrent inhibition would cause hyperreflexia but is not the primary mechanism; decreased gamma-bias would cause hypotonia; and loss of Golgi tendon organs would impair the inverse stretch reflex.`

    },
    {
        q: `A 24-year-old shows sustained ankle clonus when the foot is dorsiflexed. Primary mechanism?`,
        options: [
            `Cyclic activation of Ia and Ib afferents due to high γ-bias`,

        explanation: `Ankle clonus is a sign of upper motor neuron lesion and is due to CYCLIC ACTIVATION OF Ia AND Ib AFFERENTS DUE TO HIGH GAMMA-BIAS. When the foot is dorsiflexed, the muscle spindle is stretched, activating Ia afferents and causing reflex contraction of the gastrocnemius. The contraction stretches the spindle again, causing another reflex contraction, and so on — producing rhythmic clonus. The high gamma-bias (increased gamma motor neuron activity) makes the spindle hypersensitive to stretch. Constant Ib inhibition would reduce clonus; pure cortical oscillation is not the mechanism; Renshaw rebound is not the primary mechanism; and PAD (presynaptic inhibition) would reduce clonus.`

        q: `A patient after acute spinal cord transection (T6) shows areflexia below the lesion. Two weeks later, tendon jerks are brisk. Why?`,

    /* =====================================================================
       RENDERING — SECTION A (MCQ)
       ===================================================================== */
    function renderSectionA() {
        const container = document.getElementById('container-A');
        let html = '';
        sectionA.forEach((q, i) => {
            const qid = 'A-q' + (i + 1);
            html += '<div class="question" id="q-' + qid + '">';
            html += '<p><span class="q-badge">Q' + (i + 1) + '</span> ' + q.q + '</p>';
            html += '<div class="options">';
            q.options.forEach((opt, j) => {
                const L = String.fromCharCode(65 + j);
                html += '<label><input type="radio" name="' + qid + '" value="' + L + '"> <strong>' + L + ')</strong> ' + opt + '</label>';
            });
            html += '</div>';
            html += '<div class="question-feedback" id="fb-' + qid + '"></div>';
            html += '</div>';
        });
        container.innerHTML = html;
    }

    function submitSectionA() {
        let score = 0;
        sectionA.forEach((q, i) => {
            const qid = 'A-q' + (i + 1);
            const radios = document.getElementsByName(qid);
            let selected = null;
            for (let r = 0; r < radios.length; r++) {
                if (radios[r].checked) { selected = radios[r]; break; }
            }
            const correct = q.correct.toUpperCase();
            if (selected && selected.value === correct) score++;

            let html = '<div class="answer-block"><div class="answer-list">';
            q.options.forEach((opt, j) => {
                const L = String.fromCharCode(65 + j);
                let cls = 'answer-item';
                if (L === correct) cls += ' answer-correct';
                if (selected && selected.value === L) {
                    cls += ' user-choice';
                    if (L !== correct) cls += ' answer-wrong';
                }
                const mark = (selected && selected.value === L) ? ' ◀ your answer' : '';
                html += '<div class="' + cls + '">' + L + ') ' + opt + mark + '</div>';
            });
            html += '</div>';

            const correctIdx = correct.charCodeAt(0) - 65;
            const correctText = (correctIdx >= 0 && correctIdx < q.options.length) ? q.options[correctIdx] : '';

            if (!selected) {
                html += '<div class="explanation wrong">No answer selected. Correct answer: <strong>' +
                        correct + ') ' + correctText + '</strong>.<br>' + q.explanation + '</div>';
            } else if (selected.value === correct) {
                html += '<div class="explanation">✅ <strong>Correct.</strong><br>' + q.explanation + '</div>';
            } else {
                html += '<div class="explanation wrong">❌ <strong>Incorrect.</strong> Correct answer: <strong>' +
                        correct + ') ' + correctText + '</strong>.<br>' + q.explanation + '</div>';
            }

            const fb = document.getElementById('fb-' + qid);
            if (fb) fb.innerHTML = html;
        });

        const total = sectionA.length;
        const pct = Math.round((score / total) * 100);
        const box = document.getElementById('result-A');
        box.style.display = 'block';
        document.getElementById('score-A').innerText = score + ' / ' + total + '  (' + pct + '%)';

        document.querySelectorAll('#panel-A input[type="radio"]').forEach(r => r.disabled = true);
    }

    /* ─── INIT ─── */
    renderSectionA();

    /* ─── TAB SWITCHING ─── */
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const target = this.dataset.target;
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
            document.getElementById('panel-' + target).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    });
    </script>
