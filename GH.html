  </div>

  <script>
    // ─── DATA ──────────────────────────────────────────────────────────
    // All 60 questions with options, answers, and detailed explanations.
    // Difficulty tags: 1-20 easy, 21-40 medium, 41-60 hard.

    const allQuestions = [
      // ── EASY (1–20) ──
      {
        id: 1,
        level: "easy",
        question: "What type of cells in the anterior pituitary gland synthesize growth hormone (GH)?",
        options: [
          "A) Basophilic cells",
          "B) Acidophilic cells (somatotrophs)",
          "C) Chromophobe cells",
          "D) Folliculostellate cells"
        ],
        answer: 1, // index
        explanation: "Growth hormone is produced by <strong>somatotrophs</strong>, which are acidophilic cells of the anterior pituitary. They account for approximately 50% of the anterior pituitary cell population and are stimulated by GHRH and inhibited by somatostatin. Basophilic cells produce TSH, ACTH, FSH, and LH; chromophobes are thought to be degranulated or resting cells."
      },
      {
        id: 2,
        level: "easy",
        question: "Which structural characteristic is true regarding the main form of growth hormone?",
        options: [
          "A) It consists of a branched chain of 191 amino acids",
          "B) It consists of a single unbranched chain containing 191 amino acids",
          "C) It consists of two separate peptide chains linked by disulfide bonds",
          "D) It is a carbohydrate-rich glycoprotein with multiple subunits"
        ],
        answer: 1,
        explanation: "Human growth hormone (hGH) is a <strong>single, unbranched polypeptide chain of 191 amino acids</strong> with two intramolecular disulfide bridges. It is not glycosylated and has a molecular weight of about 22 kDa. This simple structure is important because it is species-specific; only human and monkey GH are active in humans."
      },
      {
        id: 3,
        level: "easy",
        question: "What is the basal plasma level of growth hormone in children?",
        options: [
          "A) 0.1–0.5 ng/mL",
          "B) 2–4 ng/mL",
          "C) 5–8 ng/mL",
          "D) 10–20 ng/mL"
        ],
        answer: 2,
        explanation: "In children, basal plasma GH levels are typically <strong>5–8 ng/mL</strong>. This is higher than in adults (0.1–0.5 ng/mL) because GH is essential for linear growth, and children have more frequent and larger secretory bursts, especially during deep sleep."
      },
      {
        id: 4,
        level: "easy",
        question: "How often does a rise in plasma GH levels occur due to its normal fluctuations in adults?",
        options: [
          "A) Every 10–15 minutes",
          "B) Every 1–2 hours",
          "C) Every 6–8 hours",
          "D) Once every 24 hours"
        ],
        answer: 1,
        explanation: "GH is secreted in a <strong>pulsatile fashion, with surges every 1–2 hours</strong> in adults. The largest surge occurs during deep (slow-wave) sleep. Between pulses, GH levels are often undetectable, which is why random GH measurements are not reliable for diagnosis."
      },
      {
        id: 5,
        level: "easy",
        question: "What is the basal plasma level of growth hormone in normal adults?",
        options: [
          "A) 0.1–0.5 ng/mL",
          "B) 2–4 ng/mL",
          "C) 10–20 ng/mL",
          "D) 50–100 ng/mL"
        ],
        answer: 0,
        explanation: "In normal adults, basal GH levels are very low, typically <strong>0.1–0.5 ng/mL</strong>. Because of pulsatile secretion, most random samples are low. This is important clinically: a high random GH is not necessarily abnormal, and a low random GH does not exclude GH deficiency."
      },
      {
        id: 6,
        level: "easy",
        question: "Which pattern describes how growth hormone is released into the systemic circulation?",
        options: [
          "A) Continuous steady release",
          "B) Pulsatile fashion",
          "C) Exponential constant surge",
          "D) Exclusive single peak at noon"
        ],
        answer: 1,
        explanation: "GH is released in a <strong>pulsatile fashion</strong> — discrete bursts separated by troughs. This pattern is regulated by the interplay of GHRH (stimulatory) and somatostatin (inhibitory). The most consistent and largest pulse occurs during slow-wave sleep, and pulses also follow exercise, stress, and hypoglycemia."
      },
      {
        id: 7,
        level: "easy",
        question: "Which animal’s growth hormone has biological activity similar to humans and can be safely given to humans?",
        options: [
          "A) Bovine (cow)",
          "B) Porcine (pig)",
          "C) Monkey",
          "D) Ovine (sheep)"
        ],
        answer: 2,
        explanation: "Only <strong>monkey GH</strong> (and human GH itself) has biological activity in humans. Bovine, porcine, and ovine GH are structurally different enough that they do not bind effectively to human GH receptors and have no significant growth-promoting effect. This species specificity is why human GH was historically extracted from cadaver pituitaries before recombinant DNA technology."
      },
      {
        id: 8,
        level: "easy",
        question: "Growth hormone structurally resembles which of the following pituitary/placental hormones?",
        options: [
          "A) Thyroid-stimulating hormone (TSH)",
          "B) Adrenocorticotropic hormone (ACTH)",
          "C) Placental growth hormones",
          "D) Luteinizing hormone (LH)"
        ],
        answer: 2,
        explanation: "GH belongs to the same structural family as <strong>placental growth hormones (hPL, hCS)</strong> and prolactin. These hormones share a common ancestral gene and have similar amino acid sequences and receptor structures. This is why GH has intrinsic lactogenic (prolactin-like) activity."
      },
      {
        id: 9,
        level: "easy",
        question: "What is the primary organ that secretes somatomedins (such as IGF-I)?",
        options: [
          "A) Kidneys",
          "B) Liver",
          "C) Spleen",
          "D) Pancreas"
        ],
        answer: 1,
        explanation: "The <strong>liver</strong> is the primary source of circulating somatomedins, especially IGF-I. GH stimulates hepatic IGF-I production, which then mediates many of GH's growth-promoting effects on bone and cartilage. Other tissues (muscle, kidney, cartilage) also produce IGF-I locally in a paracrine/autocrine manner."
      },
      {
        id: 10,
        level: "easy",
        question: "Another name for Somatomedin C is:",
        options: [
          "A) IGF-I",
          "B) IGF-II",
          "C) GHRH",
          "D) GRIH"
        ],
        answer: 0,
        explanation: "Somatomedin C is now known as <strong>Insulin-like Growth Factor I (IGF-I)</strong>. It is a 70-amino-acid peptide produced mainly by the liver in response to GH. IGF-I mediates the anabolic and growth-promoting effects of GH on cartilage, bone, and other tissues."
      },
      {
        id: 11,
        level: "easy",
        question: "Which hypothalamic hormone stimulates the release of GH from the anterior pituitary?",
        options: [
          "A) GRIH (Somatostatin)",
          "B) GHRH",
          "C) TRH",
          "D) CRH"
        ],
        answer: 1,
        explanation: "Growth hormone–releasing hormone (<strong>GHRH</strong>) is the primary stimulator of GH synthesis and release from anterior pituitary somatotrophs. It is a 44-amino-acid peptide produced in the arcuate nucleus of the hypothalamus. Somatostatin (GRIH) inhibits GH release."
      },
      {
        id: 12,
        level: "easy",
        question: "What primary effect does growth hormone have on bone mineralization in growing children?",
        options: [
          "A) Inhibits calcium absorption",
          "B) Promotes bone mineralization",
          "C) Causes rapid bone resorption",
          "D) Decreases bone mass"
        ],
        answer: 1,
        explanation: "GH <strong>promotes bone mineralization</strong> and linear growth. It increases intestinal calcium absorption, renal phosphate reabsorption, and osteoblast activity. This leads to a positive calcium and phosphorus balance, essential for skeletal growth. GH does not cause bone resorption; rather, it supports bone formation."
      },
      {
        id: 13,
        level: "easy",
        question: "What happens to plasma GH levels during senescence (aging)?",
        options: [
          "A) Marked increase in baseline levels",
          "B) Reduction in GH secretion in response to GHRH and other stimuli",
          "C) Complete absence of somatostatin production",
          "D) Loss of species specificity"
        ],
        answer: 1,
        explanation: "With aging, there is a <strong>reduction in GH secretion</strong> in response to GHRH, exercise, sleep, and other stimuli. Basal levels and pulse amplitude decline, contributing to loss of muscle mass (sarcopenia) and increased adiposity. This is sometimes called somatopause."
      },
      {
        id: 14,
        level: "easy",
        question: "What effect does growth hormone have on fat metabolism?",
        options: [
          "A) Increases lipogenesis",
          "B) Stimulates lipolysis and mobilizes fat from adipose tissue",
          "C) Suppresses free fatty acid release",
          "D) Converts ketone bodies into triglycerides"
        ],
        answer: 1,
        explanation: "GH <strong>stimulates lipolysis</strong> in adipose tissue, releasing free fatty acids (FFAs) into the circulation. These FFAs are used for energy, sparing glucose and protein. This is a key component of GH's diabetogenic effect and its protein-sparing action."
      },
      {
        id: 15,
        level: "easy",
        question: "How does growth hormone affect blood glucose levels?",
        options: [
          "A) It lowers blood glucose (hypoglycemia) as its ultimate long-term effect",
          "B) It is diabetogenic / causes hyperglycemia",
          "C) It has zero effect on blood glucose levels",
          "D) It completely stops glucose production by the liver"
        ],
        answer: 1,
        explanation: "GH is <strong>diabetogenic</strong> — it increases blood glucose by stimulating hepatic gluconeogenesis and glycogenolysis, and by reducing glucose uptake in muscle (anti-insulin effect). Chronically elevated GH can lead to insulin resistance and even pituitary diabetes."
      },
      {
        id: 16,
        level: "easy",
        question: "Growth hormone promotes the uptake of which building blocks into tissue cells?",
        options: [
          "A) Fatty acids",
          "B) Amino acids",
          "C) Monosaccharides",
          "D) Nucleotides"
        ],
        answer: 1,
        explanation: "GH enhances the uptake of <strong>amino acids</strong> into muscle and other tissues, stimulating protein synthesis. This anabolic effect is central to growth and tissue repair. It also increases nitrogen retention and produces a positive nitrogen balance."
      },
      {
        id: 17,
        level: "easy",
        question: "What is the term for cartilage formation induced by growth hormone?",
        options: [
          "A) Ossification",
          "B) Chondrogenesis",
          "C) Glycogenolysis",
          "D) Lipogenesis"
        ],
        answer: 1,
        explanation: "GH stimulates <strong>chondrogenesis</strong> — the formation of cartilage. It acts on epiphyseal cartilage to promote linear bone growth. The mechanism involves GH priming cartilage stem cells to respond to IGF-I, which then drives chondrocyte proliferation and matrix synthesis."
      },
      {
        id: 18,
        level: "easy",
        question: "During which phase of sleep does the major nocturnal peak of GH secretion occur?",
        options: [
          "A) REM sleep",
          "B) Stage 1 light sleep",
          "C) Deep sleep (stage 3 or stage 4 slow-wave sleep)",
          "D) Drowsiness right before falling asleep"
        ],
        answer: 2,
        explanation: "The major nocturnal GH peak occurs during <strong>deep sleep (stage 3 or 4 slow-wave sleep)</strong>, typically 1–2 hours after sleep onset. This is the largest daily pulse of GH. Disruption of slow-wave sleep (e.g., sleep apnea) can reduce GH secretion and affect growth and metabolism."
      },
      {
        id: 19,
        level: "easy",
        question: "What general effect does growth hormone have on body weight and protein deposition?",
        options: [
          "A) Decreases protein synthesis and lowers total weight",
          "B) Produces an overall anabolic effect leading to protein deposition and increased weight",
          "C) Converts structural proteins into adipose tissue",
          "D) Accelerates protein breakdown for urinary excretion"
        ],
        answer: 1,
        explanation: "GH has a powerful <strong>anabolic effect</strong>: it increases protein synthesis, reduces protein breakdown, and promotes positive nitrogen balance. This leads to increased lean body mass and overall weight gain. It also mobilizes fat, so the weight gain is primarily due to protein and water retention."
      },
      {
        id: 20,
        level: "easy",
        question: "What is the effect of growth hormone on transcription within target cells?",
        options: [
          "A) Inhibits nuclear transcriptions completely",
          "B) Stimulates transcription (RNA synthesis from DNA)",
          "C) Breaks down ribose nucleic acids in cytoplasm",
          "D) Blocks ribosomal protein synthesis"
        ],
        answer: 1,
        explanation: "GH binds to its receptor and activates <strong>transcription</strong> of specific genes, including IGF-I, and increases RNA synthesis. This leads to increased protein synthesis. GH also stimulates transcription of genes involved in cell growth and metabolism. It does not inhibit transcription or break down RNA."
      },

      // ── MEDIUM (21–40) ──
      {
        id: 21,
        level: "medium",
        question: "What happens to the rate of growth hormone secretory bursts during nocturnal sleep as a person ages?",
        options: [
          "A) They increase significantly",
          "B) They remain identical throughout life",
          "C) They are greater in children and decrease with age",
          "D) They stop entirely after age 5"
        ],
        answer: 2,
        explanation: "GH secretory bursts during sleep are <strong>greatest in children and decline with age</strong>. This is why children require more sleep for growth, and why older adults have reduced GH secretion and muscle mass. The amplitude and frequency of nocturnal GH pulses decrease progressively after puberty."
      },
      {
        id: 22,
        level: "medium",
        question: "Which tissue's growth is NOT affected by growth hormone?",
        options: [
          "A) Skeletal muscle",
          "B) Skin",
          "C) Viscera",
          "D) Nervous tissues"
        ],
        answer: 3,
        explanation: "GH promotes growth of skeletal muscle, skin, and viscera, but <strong>nervous tissue (brain and nerves)</strong> growth is largely independent of GH. Brain growth is primarily regulated by thyroid hormones, IGF-I during fetal life, and other factors. GH does not cross the blood–brain barrier significantly."
      },
      {
        id: 23,
        level: "medium",
        question: "Which hormone is mainly responsible for tissue maturation (which GH does NOT produce)?",
        options: [
          "A) Insulin",
          "B) Thyroid hormones",
          "C) Cortisol",
          "D) Parathyroid hormone"
        ],
        answer: 1,
        explanation: "While GH drives growth, <strong>thyroid hormones</strong> are essential for tissue maturation, especially of the nervous system and skeletal muscle. GH cannot substitute for thyroid hormones in this role. Children with hypothyroidism have impaired mental and physical development despite normal GH."
      },
      {
        id: 24,
        level: "medium",
        question: "What is the effect of GH on nitrogen balance and blood urea levels?",
        options: [
          "A) Negative nitrogen balance and increased blood urea",
          "B) Positive nitrogen balance and decreased blood urea",
          "C) Positive nitrogen balance and increased blood urea",
          "D) Neutral nitrogen balance and unchanged blood urea"
        ],
        answer: 1,
        explanation: "GH produces a <strong>positive nitrogen balance</strong> by increasing protein synthesis and reducing amino acid breakdown. This leads to <strong>decreased blood urea</strong> because less protein is being catabolized. This is a hallmark of GH's anabolic action."
      },
      {
        id: 25,
        level: "medium",
        question: "How does GH affect electrolyte balance in the body?",
        options: [
          "A) Increases GI absorption of Ca²⁺ and produces positive phosphorus balance",
          "B) Increases urinary excretion of Na⁺ and K⁺",
          "C) Decreases renal absorption of phosphate",
          "D) Promotes excretion of Ca²⁺ and Mg²⁺"

    // ─── STATE ──────────────────────────────────────────────────────
    let currentLevel = 'easy';
    let selectedAnswers = {}; // { questionId: optionIndex }

    // ─── DOM REFS ──────────────────────────────────────────────────
    const container = document.getElementById('questionContainer');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const questionCount = document.getElementById('questionCount');
    const difficultyBtns = document.querySelectorAll('.difficulty-btn');

    // ─── RENDER ──────────────────────────────────────────────────────
    function renderQuestions(level) {
      currentLevel = level;
      const filtered = allQuestions.filter(q => q.level === level);
      questionCount.textContent = `${filtered.length} questions`;

      // update difficulty button active state
      difficultyBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.level === level);
      });

      let html = '';
      filtered.forEach((q, idx) => {
        const qNumber = idx + 1; // display number within level
        const selectedIdx = selectedAnswers[q.id] !== undefined ? selectedAnswers[q.id] : null;
        const optionsHtml = q.options.map((opt, optIdx) => {
          const isSelected = selectedIdx === optIdx;
          const letter = String.fromCharCode(65 + optIdx); // A, B, C, D
          return `
            <div class="option ${isSelected ? 'selected' : ''}" data-qid="${q.id}" data-oidx="${optIdx}">
              <span class="letter">${letter}</span>
              <span>${opt.replace(/^[A-D]\)\s*/, '')}</span>
            </div>
          `;
        }).join('');

        html += `
          <div class="question-card" data-qid="${q.id}">
            <div class="q-top">
              <div class="q-num">${qNumber}</div>
              <div class="q-text">${q.question}</div>
            </div>
            <div class="options">
              ${optionsHtml}
            </div>
            <div class="explanation" id="exp-${q.id}">
              <span class="ans-badge">Answer: ${String.fromCharCode(65 + q.answer)}</span>
              ${q.explanation}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      // reattach option click listeners
      document.querySelectorAll('.option').forEach(opt => {
        opt.addEventListener('click', handleOptionClick);
      });

      // hide score on re-render
      scoreDisplay.classList.add('hidden');
    }

    // ─── HANDLE OPTION CLICK ─────────────────────────────────────────
    function handleOptionClick(e) {
      const optionDiv = e.currentTarget;
      const qid = parseInt(optionDiv.dataset.qid);
      const oidx = parseInt(optionDiv.dataset.oidx);

      // remove selected from siblings
      const parent = optionDiv.closest('.options');
      parent.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));

      // add selected to clicked
      optionDiv.classList.add('selected');

      // store answer
      selectedAnswers[qid] = oidx;
    }

    // ─── SUBMIT ──────────────────────────────────────────────────────
    function handleSubmit() {
      const filtered = allQuestions.filter(q => q.level === currentLevel);
      let correct = 0;
      let answered = 0;

      filtered.forEach(q => {
        const selected = selectedAnswers[q.id];
        if (selected !== undefined) {
          answered++;
          if (selected === q.answer) correct++;
        }
      });

      // show explanations for all questions in current level
      filtered.forEach(q => {
        const exp = document.getElementById(`exp-${q.id}`);
        if (exp) {
          exp.classList.add('show');
        }
      });

      // show score
      scoreDisplay.textContent = `✅ Correct: ${correct} / ${filtered.length}   •   Answered: ${answered} / ${filtered.length}`;
      scoreDisplay.classList.remove('hidden');

      // scroll to first explanation or just keep
    }

    function handleReset() {
      // clear answers for current level only
      const filtered = allQuestions.filter(q => q.level === currentLevel);
      filtered.forEach(q => {
        delete selectedAnswers[q.id];
      });

      // re-render
      renderQuestions(currentLevel);

      // hide score
      scoreDisplay.classList.add('hidden');
    }

    // ─── EVENT LISTENERS ────────────────────────────────────────────
    difficultyBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const level = btn.dataset.level;
        // clear answers for the new level to avoid confusion? 
        // keep answers per level, but re-render will show previous selections if any.
        renderQuestions(level);
      });
    });

    submitBtn.addEventListener('click', handleSubmit);
    resetBtn.addEventListener('click', handleReset);

    // ─── INIT ────────────────────────────────────────────────────────
    renderQuestions('easy');

  </script>
</body>
</html>
