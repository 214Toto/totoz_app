<body>

    <header>
        <div class="header-inner">
            <div class="logo">
                <i class="fas fa-heartbeat"></i>
                <h1>2026 Physiology Test 1 – 3rd Year</h1>
            </div>
            <span class="badge"><i class="fas fa-pencil-alt"></i> &nbsp;60 MCQs</span>
        </div>
    </header>

    <main>
        <div class="container">

            <div class="tab-bar">
                <button class="tab-btn active" data-target="section-mcq">📝 MCQs</button>
            </div>

            <div id="section-mcq" class="tab-panel">
                <div class="section-title">
                    <i class="fas fa-list-ul"></i> Multiple Choice Questions
                    <span class="count">60</span>
                </div>
                <p class="section-subtitle">Select the best answer for each question, then click <strong>Submit All MCQs</strong> below.</p>

                <form id="quizForm">
                    <div id="mcq-container"></div>
                    <div class="submit-wrap">
                        <button type="button" class="btn" onclick="submitQuiz()">
                            <i class="fas fa-check-circle"></i> Submit All MCQs
                        </button>
                    </div>
                </form>

                <div class="result" id="resultBox">
                    <h3><i class="fas fa-chart-simple"></i> Your Score</h3>
                    <div class="score" id="score">0%</div>
                    <p class="text-muted">Review the feedback below each question.</p>
                </div>
            </div>

        </div>
    </main>

    <script>
        // ─── MCQ DATA (60 questions) ──────────────────────────────
        const questions = [
            {
                q: "1. A 40-year-old with acromegaly receives a somatostatin analog. Which best describes somatostatin's physiological role in the pituitary?",
                options: [
                    "Positive feedback on GH and insulin",
                    "Autocrine stimulation of β-cells",
                    "Tyrosine kinase receptor activation",
                    "Endocrine inhibition of GH/TSH",
                    "JAK-STAT-mediated GH release"
                ],
                correct: "d",
                explanation: "Somatostatin (SST, also called growth hormone-inhibiting hormone, GHIH) is a 14-amino-acid peptide produced by hypothalamic neurons (arcuate and periventricular nuclei) and by D cells of the pancreas and gastrointestinal tract. In the anterior pituitary, somatostatin acts as an endocrine inhibitor of growth hormone (GH) and thyroid-stimulating hormone (TSH) secretion. It binds to Gi-coupled SST receptors (primarily sst2 and sst5) on somatotrophs and thyrotrophs, which decreases adenylyl cyclase activity, lowers intracellular cAMP, and reduces Ca²⁺ influx, thereby inhibiting hormone release. Somatostatin analogs such as octreotide and lanreotide are used clinically to treat acromegaly (GH-secreting pituitary adenomas), carcinoid tumors, and VIPomas. It does NOT positively stimulate GH or insulin (it inhibits both), does NOT act through tyrosine kinase receptors, and does NOT mediate JAK-STAT signaling (that is the GH receptor pathway)."
            },
            {
                q: "2. A novel GPCR agonist activates Gq. The most immediate intracellular change is:",
                options: [
                    "↑ cAMP",
                    "↑ cGMP",
                    "↑ DAG",
                    "↑ JAK-STAT",
                    "↑ Nuclear receptor binding"
                ],
                correct: "c",
                explanation: "Gq-coupled G protein-coupled receptors (GPCRs) activate phospholipase Cβ (PLCβ), which hydrolyzes phosphatidylinositol 4,5-bisphosphate (PIP₂) into inositol 1,4,5-trisphosphate (IP₃) and diacylglycerol (DAG). Both IP₃ and DAG are produced simultaneously and immediately. IP₃ triggers Ca²⁺ release from the endoplasmic reticulum by binding to IP₃ receptors, and DAG activates protein kinase C (PKC) at the membrane. Among the options, DAG is the correct second messenger generated by Gq activation. cAMP (a) is generated by Gs-coupled receptors via adenylyl cyclase; cGMP (b) is generated by guanylyl cyclase (ANP, NO); JAK-STAT (d) is the pathway of cytokine receptors (GH, prolactin, erythropoietin); and nuclear receptor binding (e) is the mechanism of steroid and thyroid hormones, not GPCRs."
            },
            {
                q: "3. A patient takes a drug that increases hepatic glucuronidation. Which hormone class will most predictably have shortened half-life?",
                options: [
                    "Peptides",
                    "Thyroid hormones",
                    "Catecholamines",
                    "Eicosanoids",
                    "Steroids"
                ],
                correct: "e",
                explanation: "Glucuronidation is a phase II conjugation reaction catalyzed by UDP-glucuronosyltransferases (UGTs) in the liver. It increases the water solubility of lipophilic compounds and facilitates their biliary and renal excretion. Steroid hormones (glucocorticoids, mineralocorticoids, androgens, estrogens) are metabolized primarily by hepatic glucuronidation and sulfation, so increased glucuronidation activity (e.g., by enzyme-inducing drugs such as phenobarbital, rifampicin, or phenytoin) will most predictably shorten their half-life. Peptides are degraded by plasma and tissue proteases; catecholamines are metabolized by COMT and MAO; eicosanoids undergo rapid oxidation and have very short half-lives already. Thyroid hormones undergo deiodination and conjugation, but the effect on steroids is the classic and most pronounced."
            },
            {
                q: "4. A lab blocks STAT dimerization in hepatocytes. Which hormone's transcriptional action is most directly impaired?",
                options: [
                    "GH",
                    "Insulin",
                    "Glucagon",
                    "PTH",
                    "Epinephrine"
                ],
                correct: "a",
                explanation: "Growth hormone (GH) binds to its receptor (a class I cytokine receptor) on hepatocytes, causing receptor dimerization and activation of the associated JAK2 tyrosine kinase. JAK2 phosphorylates STAT5b, which then dimerizes and translocates to the nucleus to regulate gene transcription — including the gene for insulin-like growth factor 1 (IGF-1). Blocking STAT dimerization would therefore most directly impair GH's transcriptional action. Insulin signals via the insulin receptor tyrosine kinase → IRS → PI3K/Akt and MAPK pathways (not STAT). Glucagon signals via Gs → cAMP → PKA; PTH via Gs → cAMP → PKA and Gq → PLC; epinephrine via α and β adrenergic GPCRs → cAMP, IP₃/DAG. None of these use STAT dimerization."
            },
            {
                q: "5. A mutation prevents GTP hydrolysis by Gsα. Consequence?",
                options: [
                    "Constitutive activation of adenylyl cyclase",
                    "Constitutive inhibition of adenylyl cyclase",
                    "Constitutive activation of PLC",
                    "Absent cAMP generation",
                    "Increased PKG activation"
                ],
                correct: "a",
                explanation: "The α-subunit of Gs (Gsα) has intrinsic GTPase activity that hydrolyzes GTP to GDP, terminating the signal. If GTP hydrolysis is prevented (e.g., by a mutation or by cholera toxin-mediated ADP-ribosylation), Gsα remains permanently in its GTP-bound, active state. It therefore constitutively activates adenylyl cyclase, causing persistently elevated intracellular cAMP and continuous activation of PKA. This is the mechanism of McCune-Albright syndrome (somatic GNAS mutations) and cholera toxin action. The other options are incorrect: Gs activates (not inhibits) adenylyl cyclase; PLC is activated by Gq; and PKG is activated by cGMP, not cAMP."
            },
            {
                q: "6. A new hormone diffuses into cells and binds a cytosolic protein that then translocates to the nucleus. This hormone most likely:",
                options: [
                    "Is stored in secretory granules",
                    "Acts within seconds with short t1/2",
                    "Raises cAMP in target cells",
                    "Is inactivated by peptidases in plasma",
                    "Requires specific globulins for transport"
                ],
                correct: "e",
                explanation: "A hormone that diffuses into cells and binds a cytosolic protein (receptor) that then translocates to the nucleus is a steroid hormone (or a related lipophilic hormone such as thyroid hormone, vitamin D, or retinoic acid). Because these hormones are lipophilic and poorly water-soluble, they require specific carrier/transport proteins in plasma — e.g., cortisol-binding globulin (CBG, transcortin), sex hormone-binding globulin (SHBG), thyroxine-binding globulin (TBG), and albumin. They are NOT stored in secretory granules (they diffuse out of cells as they are synthesized), do NOT act within seconds (their effects take hours to days because they alter gene transcription), do NOT use cAMP as a second messenger, and are NOT primarily inactivated by plasma peptidases (that applies to peptide hormones)."
            },
            {
                q: "7. After weeks of high-dose β-agonist therapy for asthma, bronchodilator response diminishes. Mechanism?",
                options: [
                    "Upregulation of β₂ receptors",
                    "Increased Gs coupling",
                    "Downregulation of β₂ receptors",
                    "Greater cAMP generation",
                    "Increased PKG activity"
                ],
                correct: "c",
                explanation: "Chronic exposure to β-agonist therapy leads to tachyphylaxis/desensitization via several mechanisms: (1) downregulation of β₂ receptors (decreased receptor number via internalization and degradation), (2) uncoupling of the receptor from Gs (phosphorylation by GRK and binding of β-arrestin), and (3) increased phosphodiesterase activity that degrades cAMP. The net effect is a diminished bronchodilator response. Upregulation of β₂ receptors (a), increased Gs coupling (b), and greater cAMP generation (d) would all increase, not decrease, the response. PKG (e) is activated by cGMP, not the β₂/cAMP pathway."
            },
            {
                q: "8. A 9-year-old with central diabetes insipidus is treated with desmopressin (V2 agonist). Which second messenger is most critical in collecting duct response?",
                options: [
                    "cAMP",
                    "cGMP",
                    "IP₃",
                    "DAG",
                    "Ca²⁺-calmodulin"
                ],
                correct: "a",
                explanation: "Desmopressin (DDAVP) is a selective V2 receptor agonist. V2 receptors on the basolateral membrane of collecting duct principal cells are Gs-coupled and activate adenylyl cyclase, increasing intracellular cAMP. cAMP activates protein kinase A (PKA), which phosphorylates aquaporin-2 (AQP2) and triggers its insertion into the apical membrane, allowing water reabsorption. This is the critical second messenger for the collecting duct response. V1A receptors use Gq → IP₃/DAG/Ca²⁺ (vasoconstriction); V1B receptors use Gq → ACTH release; oxytocin receptors use Gq → uterine contraction. cGMP is used by ANP and nitric oxide, not by V2."
            },
            {
                q: "9. A scientist mutates the β-subunit of a tyrosine kinase receptor so dimerization cannot occur. Which hormone's action is most impaired?",
                options: [
                    "GH",
                    "IGF-1",
                    "Dopamine",
                    "Inulin",
                    "Epinephrine"
                ],
                correct: "b",
                explanation: "The insulin receptor and the IGF-1 receptor are members of the receptor tyrosine kinase (RTK) family. They are synthesized as single-chain proreceptors that are proteolytically cleaved into α and β subunits, which then assemble into (αβ)₂ dimers. The α-subunit contains the ligand-binding domain, and the β-subunit contains the intrinsic tyrosine kinase domain. Mutations preventing dimerization would impair IGF-1 signaling (and insulin signaling). GH acts through a cytokine receptor (not a classic RTK) that recruits JAK2; dopamine and epinephrine act through GPCRs; inulin is a polysaccharide, not a hormone. Therefore, among the options, IGF-1 is the correct answer. (Note: IGF-1 receptors exist as pre-formed dimers, but the question is testing the concept that the β-subunit of the RTK family mediates IGF-1/insulin signaling.)"
            },
            {
                q: "10. A hypertensive patient receives ANP infusion. Which second messenger mediates its vasodilatory action?",
                options: [
                    "cAMP via PKA",
                    "IP₃ with Ca²⁺ release",
                    "DAG with PKC activation",
                    "cGMP via PKG",
                    "JAK-STAT"
                ],
                correct: "d",
                explanation: "Atrial natriuretic peptide (ANP) binds to NPR-A (natriuretic peptide receptor A), which is a membrane guanylyl cyclase. Ligand binding activates the intracellular guanylyl cyclase domain, converting GTP to cGMP. cGMP then activates protein kinase G (PKG), which causes: (1) smooth muscle relaxation and vasodilation, (2) inhibition of Na⁺ reabsorption in the collecting duct (natriuresis), (3) inhibition of renin release, and (4) inhibition of aldosterone secretion. This reduces blood pressure and blood volume. cAMP/PKA is used by β-adrenergic and other Gs pathways; IP₃/DAG is used by Gq; JAK-STAT is used by cytokine receptors."
            },
            {
                q: "11. A 33-year-old with pituitary tumor has isolated V1A receptor activation from ADH excess. Expected hemodynamic effect?",
                options: [
                    "Vasodilation",
                    "Bradycardia",
                    "Diuresis",
                    "Natriuresis",
                    "Vasoconstriction"
                ],
                correct: "e",
                explanation: "ADH (vasopressin) acts on V1A receptors on vascular smooth muscle, which are Gq-coupled. Activation leads to phospholipase C → IP₃ and DAG → increased intracellular Ca²⁺ → smooth muscle contraction → vasoconstriction. V1A activation therefore raises blood pressure. V2 receptors on the collecting duct mediate water reabsorption (antidiuresis), not diuresis; V2 activation is not involved in this scenario. Bradycardia could occur reflexively from baroreceptor activation secondary to hypertension, but the direct hemodynamic effect of V1A activation is vasoconstriction. Diuresis and natriuresis are effects of ANP, not V1A."
            },
            {
                q: "12. A 35-year-old woman with pituitary insufficiency has hypotension, hyponatremia, and low cortisol. Which feature distinguishes secondary from primary adrenal insufficiency?",
                options: [
                    "Hyperkalemia",
                    "Hyperpigmentation",
                    "Metabolic acidosis",
                    "No hyperpigmentation",
                    "Salt craving"
                ],
                correct: "d",
                explanation: "Primary adrenal insufficiency (Addison's disease) is due to adrenal cortical destruction, leading to deficiency of both glucocorticoids and mineralocorticoids. Because cortisol is low, ACTH is elevated (loss of negative feedback), and the high ACTH (via POMC-derived MSH) causes hyperpigmentation of the skin and mucous membranes. Hyperkalemia, metabolic acidosis, and salt craving are also features of mineralocorticoid deficiency. In secondary adrenal insufficiency (due to pituitary or hypothalamic disease), ACTH is low or absent, so there is NO hyperpigmentation. Aldosterone secretion is largely preserved (because it is mainly regulated by the renin-angiotensin system, not ACTH), so hyperkalemia and metabolic acidosis are typically absent. Therefore, the absence of hyperpigmentation is the key distinguishing feature."
            },
            {
                q: "13. A 37-year-old with GH excess develops carpal tunnel syndrome. Mechanism?",
                options: [
                    "Bone resorption",
                    "Demyelination",
                    "Soft-tissue overgrowth",
                    "Autoimmunity",
                    "Pituitary adenoma"
                ],
                correct: "c",
                explanation: "In acromegaly, GH excess causes widespread soft-tissue overgrowth, including thickening of the synovium, ligaments, tendons, and connective tissue. In the wrist, this soft-tissue hypertrophy (along with edema and, in some cases, bony changes) compresses the median nerve as it passes through the carpal tunnel, causing carpal tunnel syndrome. GH excess also causes bony overgrowth (acral enlargement), but the carpal tunnel syndrome is primarily due to soft-tissue overgrowth and edema, not bone resorption, demyelination, autoimmunity, or the pituitary adenoma itself (which is the cause of the GH excess, not the direct mechanism of nerve compression)."
            },
            {
                q: "14. A 25-year-old with anorexia nervosa has amenorrhea. Primary endocrine mechanism?",
                options: [
                    "↑ GnRH pulses",
                    "↑ PRL → ↓ GnRH",
                    "↑ TSH",
                    "↓ GnRH pulses",
                    "↑ Leptin"
                ],
                correct: "d",
                explanation: "Anorexia nervosa causes functional hypothalamic amenorrhea. The primary mechanism is reduced pulsatile secretion of gonadotropin-releasing hormone (GnRH) from the hypothalamus, due to low body fat, low leptin levels, and energy deficiency. Reduced GnRH pulses → reduced LH and FSH → reduced estrogen → anovulation and amenorrhea. Leptin is LOW (not high) in anorexia, and low leptin reduces kisspeptin and GnRH pulsatility. Prolactin is typically normal, TSH is normal, and GnRH pulses are decreased (not increased)."
            },
            {
                q: "15. A 37-year-old with acromegaly has colon polyps and cardiomyopathy. Which lab is most reliable for diagnosis and follow-up?",
                options: [
                    "Random GH",
                    "OGTT-stimulated GH",
                    "Serum IGF-1",
                    "Midnight cortisol",
                    "α-subunit"
                ],
                correct: "c",
                explanation: "Serum IGF-1 is the most reliable test for both diagnosis and follow-up of acromegaly. GH is secreted in pulsatile bursts (especially during sleep) and has a short half-life, so random GH levels are not useful. IGF-1 is produced by the liver in response to GH, has a long half-life (~12–15 hours), and its levels remain stable throughout the day, reflecting integrated GH secretion. IGF-1 correlates with disease activity and is used to monitor treatment response. OGTT-stimulated GH is the gold standard for confirming the diagnosis (failure of GH suppression), but it is not practical for routine follow-up. Midnight cortisol is used for Cushing's syndrome. α-subunit is used in some pituitary tumor evaluations but is not the primary marker for acromegaly."
            },
            {
                q: "16. A researcher blocks neurophysin packaging. Which hormones are most directly impaired in axonal transport?",
                options: [
                    "PRL and GH",
                    "ACTH and MSH",
                    "ADH and oxytocin",
                    "LH and FSH",
                    "TSH and GH"

        // ─── RENDER MCQ ─────────────────────────────────────────────
        function renderMCQs() {
            const container = document.getElementById('mcq-container');
            let html = '';
            questions.forEach((q, index) => {
                html += `<div class="question">`;
                html += `<p><span class="q-badge">Q${index + 1}</span> ${q.q}</p>`;
                html += `<div class="options">`;
                const letters = ['A', 'B', 'C', 'D', 'E'];
                q.options.forEach((opt, i) => {
                    html += `<label><input type="radio" name="q${index + 1}" value="${letters[i]}"> ${letters[i]}) ${opt}</label>`;
                });
                html += `</div>`;
                html += `<div class="question-feedback" id="feedback-q${index + 1}"></div>`;
                html += `</div>`;
            });
            container.innerHTML = html;
        }
        renderMCQs();

        // ─── MCQ CORRECT ANSWERS & EXPLANATIONS (FIXED) ───────────
        const correctMap = {};
        const explMap = {};
        questions.forEach((q, i) => {
            const key = 'q' + (i + 1);
            correctMap[key] = q.correct.toUpperCase();   // ← normalize to uppercase
            explMap[key] = q.explanation;
        });

        // ─── SUBMIT MCQ ─────────────────────────────────────────────
        function submitQuiz() {
            let score = 0;
            const total = questions.length;
            for (let i = 0; i < total; i++) {
                const key = 'q' + (i + 1);
                const radios = document.querySelectorAll(`input[name="${key}"]`);
                const selected = Array.from(radios).find(r => r.checked);
                const correct = correctMap[key];
                const feedbackEl = document.getElementById(`feedback-${key}`);
                if (!feedbackEl) continue;

                if (selected && selected.value === correct) score++;

                let html = `<div class="answer-block"><strong>Q${i+1}</strong><div class="answer-list">`;
                const letters = ['A', 'B', 'C', 'D', 'E'];
                const opts = questions[i].options;
                opts.forEach((opt, idx) => {
                    const val = letters[idx];
                    let cls = 'answer-item';
                    if (val === correct) cls += ' answer-correct';
                    if (selected && selected.value === val && selected.value !== correct) cls += ' answer-wrong user-choice';
                    if (selected && selected.value === val && selected.value === correct) cls += ' user-choice';
                    html += `<div class="${cls}">${letters[idx]}) ${opt}${selected && selected.value === val ? ' ◀' : ''}</div>`;
                });
                html += `</div>`;

                const correctIndex = letters.indexOf(correct);
                const correctText = correctIndex >= 0 ? opts[correctIndex] : '(unknown)';
                const explanation = explMap[key] || '';
                if (selected) {
                    if (selected.value === correct) {
                        html += `<div class="explanation">✅ Correct — ${explanation}</div>`;
                    } else {
                        html += `<div class="explanation wrong">❌ Incorrect. Correct answer: <strong>${correctText}</strong>. ${explanation}</div>`;
                    }
                } else {
                    html += `<div class="explanation wrong">No answer selected. Correct: <strong>${correctText}</strong>. ${explanation}</div>`;
                }
                html += `</div>`;
                feedbackEl.innerHTML = html;
            }

            const pct = Math.round((score / total) * 100);
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            document.getElementById('score').innerText = pct + '%';

            document.querySelectorAll('#quizForm input[type="radio"]').forEach(i => i.disabled = true);
        }

        // ─── TAB SWITCHING ──────────────────────────────────────────
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const target = this.dataset.target;
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
                document.getElementById(target).classList.remove('hidden');
            });
        });
    </script>
