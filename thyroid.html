  <script>
    // ─── DATA ──────────────────────────────────────────────────────────
    // 60 thyroid hormone questions: 1-20 easy, 21-40 medium, 41-60 hard.
    // All strings are carefully escaped to avoid syntax errors.

    const allQuestions = [
      // ── EASY (1–20) ──
      {
        id: 1, level: "easy",
        question: "Which thyroid hormone constitutes approximately 90% of total thyroid output?",
        options: [
          "A) Triiodothyronine (T3)",
          "B) Thyroxine (T4)",
          "C) Reverse T3 (rT3)",
          "D) Calcitonin"
        ],
        answer: 1,
        explanation: "The thyroid gland secretes predominantly <strong>thyroxine (T4)</strong>, which accounts for about <strong>90% of total thyroid hormone output</strong>. T3 (triiodothyronine) accounts for roughly 10%, and reverse T3 (rT3) is less than 1%. Although T4 is the major secretory product, T3 is the biologically active form at target tissues, where T4 is converted to T3 by deiodinase enzymes. T4 has a longer half-life (~7 days) compared to T3 (~1 day), making it a stable circulating reservoir."
      },
      {
        id: 2, level: "easy",
        question: "Which cells in the thyroid gland secrete calcitonin?",
        options: [
          "A) Follicular epithelial cells",
          "B) Parafollicular cells",
          "C) Thyrotrope cells",
          "D) Fibroblasts"
        ],
        answer: 1,
        explanation: "Calcitonin is secreted by the <strong>parafollicular cells (C cells)</strong> of the thyroid gland. These cells are located between the follicles and are distinct from the follicular epithelial cells that produce T4 and T3. Calcitonin lowers blood calcium by inhibiting osteoclast activity and promoting renal calcium excretion. Its role in adult human calcium homeostasis is minor compared to parathyroid hormone (PTH)."
      },
      {
        id: 3, level: "easy",
        question: "What is the minimal daily requirement of iodine needed to maintain normal thyroid function?",
        options: [
          "A) 100-200 mcg (about 150 mcg)",
          "B) 500 mcg",
          "C) 80 mcg",
          "D) 400 mcg"
        ],
        answer: 0,
        explanation: "The minimal daily iodine requirement is <strong>100-200 mcg, with an average of about 150 mcg</strong>. Iodine is essential for thyroid hormone synthesis; deficiency leads to goiter and hypothyroidism. The World Health Organization recommends 150 mcg/day for adults, 250 mcg/day for pregnant and lactating women. In iodine-sufficient areas, the thyroid gland efficiently traps about 120 mcg of the ingested 500 mcg daily."
      },
      {
        id: 4, level: "easy",
        question: "Under normal function, how much iodine does the thyroid gland take up daily when 500 mcg are ingested?",
        options: [
          "A) 500 mcg",
          "B) 380 mcg",
          "C) 120 mcg",
          "D) 80 mcg"
        ],
        answer: 2,
        explanation: "When 500 mcg of iodine is ingested daily, the normal thyroid gland takes up approximately <strong>120 mcg</strong>. The remaining 380 mcg is excreted by the kidneys. This reflects the thyroid's ability to concentrate iodide against a gradient. The gland contains about 95% of the body's total iodine stores, mostly in the form of thyroglobulin-bound hormone."
      },
      {
        id: 5, level: "easy",
        question: "What is the primary chemical class/structure of Thyroid Stimulating Hormone (TSH)?",
        options: [
          "A) Steroid hormone",
          "B) Glycoprotein",
          "C) Polypeptide",
          "D) Amino acid derivative"
        ],
        answer: 1,
        explanation: "TSH is a <strong>glycoprotein</strong> hormone secreted by the anterior pituitary. It consists of alpha and beta subunits; the alpha subunit is shared with FSH, LH, and hCG, while the beta subunit confers specificity. TSH stimulates all steps of thyroid hormone synthesis and secretion, including iodide trapping, thyroglobulin synthesis, organification, and coupling. It also trophically stimulates thyroid cell growth."
      },
      {
        id: 6, level: "easy",
        question: "Which hormone is secreted by the hypothalamus to stimulate TSH release?",
        options: [
          "A) Growth hormone-releasing hormone (GHRH)",
          "B) Thyrotropin-releasing hormone (TRH)",
          "C) Somatostatin",
          "D) Human chorionic gonadotropin (hCG)"
        ],
        answer: 1,
        explanation: "<strong>Thyrotropin-releasing hormone (TRH)</strong> is a tripeptide secreted by the hypothalamus that stimulates TSH release from the anterior pituitary. TRH also stimulates prolactin secretion. It is the primary regulator of the hypothalamic-pituitary-thyroid axis. TRH secretion is inhibited by thyroid hormones via negative feedback and stimulated by cold exposure in neonates."
      },
      {
        id: 7, level: "easy",
        question: "In normal adults, what is the average Basal Metabolic Rate (B.M.R.) value?",
        options: [
          "A) 20 +/- 5% kcal/sq.m/hour",
          "B) 40 +/- 15% kcal/sq.m/hour",
          "C) 120 +/- 10% kcal/sq.m/hour",
          "D) 200 +/- 15% kcal/sq.m/hour"
        ],
        answer: 1,
        explanation: "The normal average BMR in adults is <strong>40 +/- 15% kcal/sq.m/hour</strong>. Thyroid hormones are major regulators of BMR; hyperthyroidism increases BMR by 50-100%, while hypothyroidism decreases it by 30-50%. BMR measurement was historically used to assess thyroid function but has been largely replaced by direct hormone assays."
      },
      {
        id: 8, level: "easy",
        question: "What is the normal baseline concentration of serum cholesterol specified in the text?",
        options: [
          "A) About 120 mg%",
          "B) About 200 mg%",
          "C) About 400 mg%",
          "D) About 50 mg%"
        ],
        answer: 1,
        explanation: "Normal serum cholesterol is approximately <strong>200 mg%</strong>. Thyroid hormones increase cholesterol excretion in bile and enhance LDL receptor expression. In hypothyroidism, cholesterol levels rise (often above 300 mg%), increasing cardiovascular risk. In hyperthyroidism, cholesterol falls below 120 mg% due to accelerated excretion and metabolism."
      },
      {
        id: 9, level: "easy",
        question: "What histology is characteristic of active follicular cells in the thyroid gland?",
        options: [
          "A) Flattened squamous cells",
          "B) Cuboidal / Columnar cells with reabsorption lacunae",
          "C) Multinucleated giant cells",
          "D) Stratified epithelium"
        ],
        answer: 1,
        explanation: "Active thyroid follicular cells are <strong>cuboidal to columnar</strong> with <strong>reabsorption lacunae</strong> (small pink vacuoles where colloid has been taken up). Inactive follicles are lined by flattened squamous cells and contain abundant dense colloid. The histological appearance reflects the functional state: TSH stimulation causes hypertrophy and hyperplasia with tall columnar cells and scalloped colloid margins."
      },
      {
        id: 10, level: "easy",
        question: "What percentage of the body's total iodine content is stored in the thyroid gland?",
        options: [
          "A) 50%",
          "B) 75%",
          "C) 95%",
          "D) 100%"
        ],
        answer: 2,
        explanation: "Approximately <strong>95%</strong> of the body's total iodine content is stored in the thyroid gland, primarily within the colloid as thyroglobulin-bound hormone. The total body iodine is about 20-30 mg in adults, of which 15-20 mg is in the thyroid. This large reservoir allows the gland to maintain hormone production during periods of iodine deficiency."
      },
      {
        id: 11, level: "easy",
        question: "Reverse T3 (rT3) makes up approximately what percentage of daily thyroid output?",
        options: [
          "A) Less than 1%",
          "B) 10%",
          "C) 50%",
          "D) 90%"
        ],
        answer: 0,
        explanation: "Reverse T3 (rT3) constitutes <strong>less than 1%</strong> of daily thyroid output. rT3 is an inactive metabolite of T4, produced by inner-ring deiodination. It is biologically inactive and may serve as a regulator of thyroid hormone action by competing with T3. Levels increase in stress, starvation, and illness (euthyroid sick syndrome)."
      },
      {
        id: 12, level: "easy",
        question: "Which enzyme complex synthesizes T4 and T3 from tyrosine and iodide?",
        options: [
          "A) Deiodinase",
          "B) Peroxidase",
          "C) Adenylyl cyclase",
          "D) Protease"
        ],
        answer: 1,
        explanation: "<strong>Thyroid peroxidase (TPO)</strong> is the enzyme complex that catalyzes both the organification of iodide (incorporation into tyrosine residues on thyroglobulin) and the coupling of iodotyrosines (MIT and DIT) to form T4 and T3. TPO is a membrane-bound enzyme located at the apical border of the follicular cell. It requires hydrogen peroxide as a cofactor. TPO is the target of antithyroid drugs like propylthiouracil and methimazole."
      },
      {
        id: 13, level: "easy",
        question: "What happens to the thyroid gland following a hypophysectomy?",
        options: [
          "A) Hypertrophies",
          "B) Atrophies",
          "C) Develops toxic nodular goiter",
          "D) Forms exophthalmos"
        ],
        answer: 1,
        explanation: "After hypophysectomy (removal of the pituitary), the thyroid gland <strong>atrophies</strong> due to loss of TSH stimulation. TSH is trophic for the thyroid; without it, follicles become inactive, colloid is depleted, and the gland shrinks. Thyroid hormone secretion falls, leading to secondary hypothyroidism. This demonstrates the dependence of the thyroid on pituitary TSH for both function and structural integrity."
      },
      {
        id: 14, level: "easy",
        question: "What normal average plasma level is given for TSH?",
        options: [
          "A) 2 microunits/ml",
          "B) 10 microunits/ml",
          "C) 80 microunits/ml",
          "D) 0.15 microunits/ml"
        ],
        answer: 0,
        explanation: "The normal average plasma TSH level is approximately <strong>2 microunits/ml</strong> (with a usual range of 0.5-5 microunits/ml). TSH is the most sensitive indicator of thyroid function: it rises in primary hypothyroidism and falls in hyperthyroidism. The log-linear relationship between TSH and free T4 means small changes in free T4 produce large changes in TSH."
      },
      {
        id: 15, level: "easy",
        question: "What physical condition is defined as a generalized enlargement of the thyroid gland?",
        options: [
          "A) Myxedema",
          "B) Goiter",
          "C) Cretinism",
          "D) Exophthalmos"
        ],
        answer: 1,
        explanation: "<strong>Goiter</strong> is a generalized enlargement of the thyroid gland. It can occur in euthyroid, hypothyroid, or hyperthyroid states. Common causes include iodine deficiency (endemic goiter), Hashimoto's thyroiditis, Graves' disease, and goitrogens. The enlargement may be diffuse or nodular, and may be associated with normal, decreased, or increased hormone production."
      },
      {
        id: 16, level: "easy",
        question: "How does thyroid hormone affect resting respiratory rate and minute ventilation?",
        options: [
          "A) Decreases them",
          "B) Increases them",
          "C) Has no effect",
          "D) Causes complete respiratory arrest"
        ],
        answer: 1,
        explanation: "Thyroid hormones <strong>increase resting respiratory rate and minute ventilation</strong>. This is due to increased oxygen consumption and CO2 production, which stimulate the respiratory center. In hyperthyroidism, dyspnea and increased respiratory rate are common. In severe hypothyroidism, respiratory depression and hypoventilation may occur."
      },
      {
        id: 17, level: "easy",
        question: "What effect do thyroid hormones have on fat stores in adipose tissue?",
        options: [
          "A) Inhibition of fat breakdown",
          "B) Mobilization of fat and increased free fatty acid oxidation",
          "C) Storage of triglycerides",
          "D) Conversion of fatty acids into glucose"
        ],
        answer: 1,
        explanation: "Thyroid hormones <strong>mobilize fat</strong> from adipose tissue and <strong>increase free fatty acid oxidation</strong>. They enhance lipolysis and increase the sensitivity of adipose tissue to catecholamines. This leads to decreased fat stores and increased plasma free fatty acids. In hyperthyroidism, weight loss occurs despite increased appetite due to accelerated fat and protein catabolism."
      },
      {
        id: 18, level: "easy",
        question: "TSH secretion displays a circadian rhythm that peaks at what time?",
        options: [
          "A) 9 PM",
          "B) Midnight",
          "C) 6 AM",
          "D) Noon"
        ],
        answer: 1,
        explanation: "TSH secretion peaks at approximately <strong>midnight</strong> (around 2-4 AM) and is lowest in the late afternoon. This circadian rhythm is driven by the suprachiasmatic nucleus and is influenced by sleep, light exposure, and thyroid hormone levels. The nocturnal TSH surge may contribute to the maintenance of thyroid hormone levels during sleep."
      },
      {
        id: 19, level: "easy",
        question: "Which condition is marked by mental retardation as a striking feature in children due to lack of thyroid hormone?",
        options: [
          "A) Graves' disease",
          "B) Congenital hypothyroidism",
          "C) Toxic nodular goiter",
          "D) Hyperthyroidism"
        ],
        answer: 1,
        explanation: "<strong>Congenital hypothyroidism</strong> (cretinism) is characterized by severe mental retardation if untreated. Thyroid hormone is critical for brain development, especially during the first year of life. Other features include dwarfism, coarse facies, macroglossia, umbilical hernia, and constipation. Early diagnosis by newborn screening and prompt thyroxine replacement can prevent irreversible brain damage."
      },
      {
        id: 20, level: "easy",
        question: "What is the normal value range for Protein-Bound Iodine (PBI)?",
        options: [
          "A) 1-2 mcg%",
          "B) 4-8 mcg%",
          "C) 10-15 mcg%",
          "D) 20-30 mcg%"
        ],
        answer: 1,
        explanation: "The normal range for Protein-Bound Iodine (PBI) is <strong>4-8 mcg%</strong>. PBI measures the iodine bound to plasma proteins, primarily thyroxine-binding globulin (TBG). It is elevated in hyperthyroidism and decreased in hypothyroidism. However, PBI is influenced by iodine intake, pregnancy, estrogen therapy, and other factors, making it non-specific; it has been largely replaced by direct hormone assays."
      },

      // ── MEDIUM (21–40) ──
      {
        id: 21, level: "medium",
        question: "What is the secondary messenger used by TSH to exert its generalized stimulating effects on thyroid cells?",
        options: [
          "A) Inositol trisphosphate (IP3)",
          "B) Diacylglycerol (DAG)",
          "C) Cyclic AMP (cAMP)",
          "D) Cyclic GMP (cGMP)"
        ],
        answer: 2,
        explanation: "TSH binds to its G-protein coupled receptor on thyroid follicular cells and activates <strong>adenylyl cyclase</strong>, producing <strong>cyclic AMP (cAMP)</strong> as the primary second messenger. cAMP activates protein kinase A, which phosphorylates multiple target proteins to stimulate iodide trapping, thyroglobulin synthesis, organification, coupling, endocytosis, and hormone release. TSH also increases cAMP in all thyroid cell types, including parafollicular cells."
      },
      {
        id: 22, level: "medium",
        question: "Besides TSH receptors, which receptors on thyroid cells promote their growth?",
        options: [
          "A) Insulin-like Growth Factor 1 (IGF-1) receptors",
          "B) Epidermal Growth Factor (EGF) receptors",
          "C) Beta-1 adrenergic receptors",
          "D) Cortisol receptors"
        ],
        answer: 0,
        explanation: "In addition to TSH receptors, <strong>IGF-1 receptors</strong> on thyroid cells promote growth and proliferation. IGF-1 acts synergistically with TSH to stimulate thyroid cell hypertrophy and hyperplasia. Other growth factors like EGF, fibroblast growth factor (FGF), and platelet-derived growth factor (PDGF) also modulate thyroid growth. This is relevant in goitrogenesis and thyroid neoplasia."
      },
      {
        id: 23, level: "medium",
        question: "Which set of factors all act to inhibit TSH secretion?",
        options: [
          "A) Cold exposure, TRH, and pregnancy",
          "B) Dopamine, somatostatin, and glucocorticoids",
          "C) hCG, epinephrine, and insulin",
          "D) IGF-1, T3, and acetylcholine"
        ],
        answer: 1,
        explanation: "<strong>Dopamine, somatostatin, and glucocorticoids</strong> all inhibit TSH secretion. Dopamine and somatostatin directly suppress TRH and TSH release. Glucocorticoids inhibit TRH synthesis and TSH secretion, which is why they can cause transient hypothyroidism. In contrast, TRH and cold exposure stimulate TSH; hCG and pregnancy can stimulate the thyroid via TSH receptor cross-reactivity."
      },
      {
        id: 24, level: "medium",
        question: "In high concentrations, how do thyroid hormones affect protein metabolism?",
        options: [
          "A) Anabolic effect leading to positive nitrogen balance",
          "B) Catabolic effect leading to negative nitrogen balance and muscle weakness",
          "C) Complete inhibition of protein synthesis without breakdown",
          "D) No change in protein turnover"
        ],
        answer: 1,
        explanation: "At high concentrations (as in hyperthyroidism), thyroid hormones have a <strong>catabolic effect</strong> on protein metabolism, causing <strong>negative nitrogen balance</strong> and muscle weakness (thyrotoxic myopathy). They increase protein degradation and amino acid release from muscle. At physiological levels, thyroid hormones are permissive for normal protein synthesis and growth. This catabolic effect contributes to weight loss and muscle wasting in thyrotoxicosis."
      },
      {
        id: 25, level: "medium",
        question: "Why does hypercarotenemia cause a yellow skin color in hypothyroidism without affecting the sclera?",
        options: [
          "A) Carotene is selectively deposited only in cutaneous fat cells",
          "B) T4 is required for converting carotene to Vitamin A; slow conversion leads to accumulation in blood/skin, while scleral vessels exclude it",
          "C) Sclera contains high deiodinase levels that break down carotene",
          "D) Hypothyroidism causes bilirubin retention only in the sclera"
        ],
        answer: 1,
        explanation: "In hypothyroidism, <strong>T4 is required to convert carotene to vitamin A</strong>. When T4 is deficient, carotene accumulates in the blood and skin, causing a yellow discoloration (hypercarotenemia). The sclera is spared because carotene is deposited in the dermis and subcutaneous fat, and the sclera has no fat; the yellow color does not extend to the sclera. This differs from jaundice, where bilirubin stains the sclera."
      },
      {
        id: 26, level: "medium",
        question: "How do thyroid hormones affect blood pressure?",
        options: [
          "A) Increase diastolic BP, decrease systolic BP",
          "B) Increase systolic BP, decrease diastolic BP, leaving mean arterial pressure usually unchanged",
          "C) Increase both systolic and diastolic BP equally",
          "D) Decrease both systolic and diastolic BP"

      questionCount.textContent = filtered.length + ' questions';

      difficultyBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.level === level);
      });

      let html = '';
      filtered.forEach((q, idx) => {
        const qNumber = idx + 1;
        const selectedIdx = selectedAnswers[q.id] !== undefined ? selectedAnswers[q.id] : null;
        const optionsHtml = q.options.map((opt, optIdx) => {
          const isSelected = selectedIdx === optIdx;
          const letter = String.fromCharCode(65 + optIdx);
          return '<div class="option ' + (isSelected ? 'selected' : '') + '" data-qid="' + q.id + '" data-oidx="' + optIdx + '">' +
            '<span class="letter">' + letter + '</span>' +
            '<span>' + opt.replace(/^[A-D]\)\s*/, '') + '</span>' +
          '</div>';
        }).join('');

        html += '<div class="question-card" data-qid="' + q.id + '">' +
          '<div class="q-top">' +
            '<div class="q-num">' + qNumber + '</div>' +
            '<div class="q-text">' + q.question + '</div>' +
          '</div>' +
          '<div class="options">' + optionsHtml + '</div>' +
          '<div class="explanation" id="exp-' + q.id + '">' +
            '<span class="ans-badge">Answer: ' + String.fromCharCode(65 + q.answer) + '</span>' +
            q.explanation +
          '</div>' +
        '</div>';
      });

      container.innerHTML = html;
      document.querySelectorAll('.option').forEach(opt => {
        opt.addEventListener('click', handleOptionClick);
      });

      scoreDisplay.classList.add('hidden');
    }

    // ─── HANDLE OPTION CLICK ─────────────────────────────────────────
    function handleOptionClick(e) {
      const optionDiv = e.currentTarget;
      const qid = parseInt(optionDiv.dataset.qid);
      const oidx = parseInt(optionDiv.dataset.oidx);

      const parent = optionDiv.closest('.options');
      parent.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));

      optionDiv.classList.add('selected');
      selectedAnswers[qid] = oidx;
    }

    // ─── SUBMIT ──────────────────────────────────────────────────────
    function handleSubmit() {
      const filtered = allQuestions.filter(q => q.level === currentLevel);
      let correct = 0;
      let answered = 0;

      filtered.forEach(q => {
        const selected = selectedAnswers[q.id];
        if (selected !== undefined) {
          answered++;
          if (selected === q.answer) correct++;
        }
      });

      filtered.forEach(q => {
        const exp = document.getElementById('exp-' + q.id);
        if (exp) exp.classList.add('show');
      });

      scoreDisplay.textContent = 'Correct: ' + correct + ' / ' + filtered.length + '   --   Answered: ' + answered + ' / ' + filtered.length;
      scoreDisplay.classList.remove('hidden');
    }

    // ─── RESET ──────────────────────────────────────────────────────
    function handleReset() {
      const filtered = allQuestions.filter(q => q.level === currentLevel);
      filtered.forEach(q => { delete selectedAnswers[q.id]; });
      renderQuestions(currentLevel);
      scoreDisplay.classList.add('hidden');
    }

    // ─── EVENT LISTENERS ────────────────────────────────────────────
    difficultyBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        renderQuestions(btn.dataset.level);
      });
    });

    submitBtn.addEventListener('click', handleSubmit);
    resetBtn.addEventListener('click', handleReset);

    // ─── INIT ────────────────────────────────────────────────────────
    renderQuestions('easy');
  </script>
</body>
</html>
