      // ── EASY (1–20) ──
      {
        id: 1, level: "easy",
        question: "What type of molecule is Antidiuretic Hormone (ADH) structurally?",

          "D) Glycoprotein containing two subunit chains"

        answer: 1,
        explanation: "ADH (arginine vasopressin) is a <strong>polypeptide neurohormone composed of exactly 9 amino acids</strong>. It is structurally homologous to oxytocin, differing only at positions 3 and 8. Both are synthesized as part of larger precursor molecules (prepropressophysin and preprooxyphysin, respectively) that include a carrier protein called neurophysin. ADH is not a steroid, amine, or glycoprotein. Its small size allows it to be synthesized on ribosomes and packaged into secretory granules for axonal transport."

      {
        id: 2, level: "easy",
        question: "In which hypothalamic nucleus is ADH predominantly synthesized?",

          "C) Supraoptic nucleus",
          "D) Ventromedial nucleus"
        ],
        answer: 2,
        explanation: "ADH is predominantly synthesized in the <strong>supraoptic nucleus</strong> of the hypothalamus (more than 80% of ADH-forming neurons). The paraventricular nucleus also contains both ADH and oxytocin neurons, but the supraoptic nucleus is the primary source of ADH. The arcuate nucleus is involved in GHRH and dopamine production, while the ventromedial nucleus regulates satiety and glucose sensing. Both supraoptic and paraventricular neurons project axons down the hypothalamo-hypophysial tract to the posterior pituitary."

        question: "What are the secretory granules containing stored ADH and oxytocin in the posterior pituitary called?",

          "B) Nissl bodies",
          "C) Herring bodies",
          "D) Hassall corpuscles"

        answer: 2,
        explanation: "<strong>Herring bodies</strong> are the terminal swellings of magnocellular neuron axons in the posterior pituitary that contain stored secretory granules of ADH and oxytocin. They are visible on light microscopy as eosinophilic masses. Pituicytes are supporting glial cells; Nissl bodies are rough ER in neuronal cell bodies; Hassall corpuscles are found in the thymus. Herring bodies serve as the storage site for neurohypophysial hormones until release is triggered by action potentials."

      {
        id: 4, level: "easy",
        question: "Which receptor mediates the antidiuretic action of ADH on the renal tubular cells?",

          "A) V1A receptor",
          "B) V1B receptor",
          "C) V2 receptor",
          "D) V3 receptor"
        ],
        answer: 2,
        explanation: "The antidiuretic effect of ADH on renal collecting ducts and distal convoluted tubules is mediated specifically via <strong>V2 receptors</strong> located on the basolateral membrane of principal cells. V2 receptors couple to Gs proteins and activate adenylyl cyclase, increasing cAMP. V1A receptors mediate vasoconstriction in vascular smooth muscle; V1B (V3) receptors mediate ACTH release from the anterior pituitary. The V2 receptor is the target of desmopressin, a synthetic ADH analog used to treat central diabetes insipidus."
      },
      {
        id: 5, level: "easy",

          "C) Cyclic AMP (cAMP)",

        answer: 2,
        explanation: "Binding of ADH to V2 receptors activates <strong>adenylyl cyclase</strong> via the Gs protein, leading to increased intracellular <strong>cAMP</strong> levels. cAMP then activates protein kinase A (PKA), which phosphorylates aquaporin-2-containing vesicles and other target proteins, promoting their translocation to the apical membrane. IP3 and DAG are products of phospholipase C activation, which is linked to V1A receptors. cGMP is the second messenger for ANP and nitric oxide."
      },
      {
        id: 6, level: "easy",
        question: "Which aquaporin water channels are inserted into the luminal membrane of renal principal cells in response to ADH?",

          "B) Aquaporin-2",
          "C) Aquaporin-4",
          "D) Aquaporin-5"

        explanation: "Activation of protein kinase A via V2 receptor signaling leads to the rapid insertion of <strong>aquaporin-2 (AQP2)</strong> water channels into the luminal (apical) membrane of collecting duct principal cells. Aquaporin-3 and aquaporin-4 are constitutively present on the basolateral membrane and allow water to exit the cell into the interstitium. Aquaporin-1 is found in the proximal tubule and descending limb of Henle. Aquaporin-5 is present in salivary and lacrimal glands. Mutations in AQP2 cause nephrogenic diabetes insipidus."
      },
      {
        id: 7, level: "easy",
        question: "What is the biological half-life of ADH in circulation?",

          "A) 1 to 5 minutes",
          "B) 16 to 20 minutes",
          "C) 45 to 60 minutes",
          "D) 2 to 4 hours"

        explanation: "The biological half-life of ADH after release into the circulation is <strong>16–20 minutes</strong>. It is rapidly inactivated in the liver and kidneys by proteolytic enzymes (vasopressinases). This short half-life ensures that ADH action is tightly regulated and rapidly reversible. In contrast, oxytocin has a half-life of about 3–5 minutes, and thyroid hormones have half-lives of days. The short half-life of ADH is clinically relevant: continuous secretion is required to maintain antidiuresis, and desmopressin (a synthetic analog) has a longer half-life of 6–20 hours."
      },
      {
        id: 8, level: "easy",

          "C) Atria and pulmonary vessels",

        answer: 1,
        explanation: "Osmoreceptors are located in the anterior hypothalamus within the circumventricular organs, specifically the <strong>organum vasculosum of lamina terminalis (OVLT)</strong>. These specialized neurons are outside the blood-brain barrier, allowing them to sense plasma osmolality directly. Carotid sinus and aortic arch contain baroreceptors for blood pressure; atria contain volume receptors; the juxtaglomerular apparatus regulates renin secretion. The OVLT osmoreceptors are exquisitely sensitive, detecting changes in plasma osmolality of as little as 1–2%."
      },
      {
        id: 9, level: "easy",
        question: "How does an increase in plasma osmolality affect ADH release?",
        options: [
          "A) Stimulates shrinkage of osmoreceptors and increases ADH release",

          "C) Directly inhibits magnocellular neuron discharge",
          "D) Promotes rapid degradation of ADH in the blood"
        ],
        answer: 0,
        explanation: "An increase in plasma osmolality causes water to move out of osmoreceptor cells by osmosis, leading to <strong>cellular shrinkage</strong>. This shrinkage increases the firing rate of osmoreceptor neurons, which stimulates magnocellular neurons in the supraoptic and paraventricular nuclei to release ADH. The increased ADH then acts on the kidneys to reabsorb water, diluting the plasma and returning osmolality to normal. This is a classic negative feedback loop. Conversely, decreased plasma osmolality causes osmoreceptor swelling and inhibits ADH release."
      },
      {
        id: 10, level: "easy",
        question: "Which condition is characterized by excessive, uncontrolled secretion of ADH leading to water retention and hyponatremia?",

          "A) Central Diabetes Insipidus",
          "B) Nephrogenic Diabetes Insipidus",
          "C) Syndrome of Inappropriate Antidiuretic Hormone Secretion (SIADH)",

        answer: 2,
        explanation: "<strong>SIADH</strong> is characterized by hypersecretion of ADH despite plasma hypo-osmolality, leading to excessive water retention, dilutional hyponatremia, and concentrated urine. It is caused by ectopic ADH production (e.g., small cell lung carcinoma), CNS disorders, pulmonary disease, or drugs. Central and nephrogenic diabetes insipidus involve ADH deficiency or resistance, causing polyuria and hypernatremia. Primary aldosteronism causes hypertension and hypokalemia, not hyponatremia. Treatment of SIADH includes fluid restriction, demeclocycline, and correction of the underlying cause."
      },
      {
        id: 11, level: "easy",
        question: "What is the principal symptom feature of Diabetes Insipidus?",
        options: [

          "D) Hypertension and fluid overload"

      },
      {

      },
      {
        id: 13, level: "easy",
        question: "Where are V1 / V1A receptors predominantly expressed to exert vascular effects?",

          "A) Renal tubular epithelial cells",
          "B) Vascular smooth muscle cells / Arterioles",

          "D) Cardiac atrial myocytes"

      },
      {
        id: 14, level: "easy",

      },
      {
        id: 15, level: "easy",
        question: "What is the normal set-point for plasma osmolality maintained by ADH regulation?",

      },
      {
        id: 16, level: "easy",
        question: "Which hormone released by cardiac atrial myocytes inhibits ADH secretion during volume expansion?",

      },
      {
        id: 17, level: "easy",
        question: "What primary defect causes Central (Cranial) Diabetes Insipidus?",

    // ─── STATE ──────────────────────────────────────────────────────
    let currentLevel = 'easy';
    let selectedAnswers = {};

    // ─── DOM REFS ──────────────────────────────────────────────────
    const container = document.getElementById('questionContainer');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const questionCount = document.getElementById('questionCount');
    const difficultyBtns = document.querySelectorAll('.difficulty-btn');

    // ─── RENDER ──────────────────────────────────────────────────────
    function renderQuestions(level) {
      currentLevel = level;
      const filtered = allQuestions.filter(q => q.level === level);
      questionCount.textContent = filtered.length + ' questions';

      difficultyBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.level === level);
      });

      let html = '';
      filtered.forEach((q, idx) => {
        const qNumber = idx + 1;
        const selectedIdx = selectedAnswers[q.id] !== undefined ? selectedAnswers[q.id] : null;
        const optionsHtml = q.options.map((opt, optIdx) => {
          const isSelected = selectedIdx === optIdx;
          const letter = String.fromCharCode(65 + optIdx);
          return '<div class="option ' + (isSelected ? 'selected' : '') + '" data-qid="' + q.id + '" data-oidx="' + optIdx + '">' +
            '<span class="letter">' + letter + '</span>' +
            '<span>' + opt.replace(/^[A-D]\)\s*/, '') + '</span>' +
          '</div>';
        }).join('');

        html += '<div class="question-card" data-qid="' + q.id + '">' +
          '<div class="q-top">' +
            '<div class="q-num">' + qNumber + '</div>' +
            '<div class="q-text">' + q.question + '</div>' +
          '</div>' +
          '<div class="options">' + optionsHtml + '</div>' +
          '<div class="explanation" id="exp-' + q.id + '">' +
            '<span class="ans-badge">Answer: ' + String.fromCharCode(65 + q.answer) + '</span>' +
            q.explanation +
          '</div>' +
        '</div>';
      });

      container.innerHTML = html;
      document.querySelectorAll('.option').forEach(opt => {
        opt.addEventListener('click', handleOptionClick);
      });

      scoreDisplay.classList.add('hidden');
    }

    // ─── HANDLE OPTION CLICK ─────────────────────────────────────────
    function handleOptionClick(e) {
      const optionDiv = e.currentTarget;
      const qid = parseInt(optionDiv.dataset.qid);
      const oidx = parseInt(optionDiv.dataset.oidx);

      const parent = optionDiv.closest('.options');
      parent.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));

      optionDiv.classList.add('selected');
      selectedAnswers[qid] = oidx;
    }

    // ─── SUBMIT ──────────────────────────────────────────────────────
    function handleSubmit() {
      const filtered = allQuestions.filter(q => q.level === currentLevel);
      let correct = 0;
      let answered = 0;

      filtered.forEach(q => {
        const selected = selectedAnswers[q.id];
        if (selected !== undefined) {
          answered++;
          if (selected === q.answer) correct++;
        }
      });

      filtered.forEach(q => {
        const exp = document.getElementById('exp-' + q.id);
        if (exp) exp.classList.add('show');
      });

      scoreDisplay.textContent = 'Correct: ' + correct + ' / ' + filtered.length + '   --   Answered: ' + answered + ' / ' + filtered.length;
      scoreDisplay.classList.remove('hidden');
    }

    // ─── RESET ──────────────────────────────────────────────────────
    function handleReset() {
      const filtered = allQuestions.filter(q => q.level === currentLevel);
      filtered.forEach(q => { delete selectedAnswers[q.id]; });
      renderQuestions(currentLevel);
      scoreDisplay.classList.add('hidden');
    }

    // ─── EVENT LISTENERS ────────────────────────────────────────────
    difficultyBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        renderQuestions(btn.dataset.level);
      });
    });

    submitBtn.addEventListener('click', handleSubmit);
    resetBtn.addEventListener('click', handleReset);

    // ─── INIT ────────────────────────────────────────────────────────
    renderQuestions('easy');
  </script>
